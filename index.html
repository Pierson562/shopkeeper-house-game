<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocktown General Store</title>
  <style>
    :root{--ink:#f5f1df;--muted:#b9b39d;--gold:#f2c94c;--gold-dark:#a87d18;--panel:#303030;--panel-dark:#202020;--line:#111;--green:#6fbd5b;--red:#d9584d;}
    *{box-sizing:border-box} body{margin:0;background:#171717;color:var(--ink);font-family:"Courier New",monospace;font-size:14px;image-rendering:pixelated;background-image:linear-gradient(45deg,#191919 25%,transparent 25%),linear-gradient(-45deg,#191919 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#191919 75%),linear-gradient(-45deg,transparent 75%,#191919 75%);background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0}
    button,select{font:inherit} button{cursor:pointer;color:#171717;font-weight:bold;text-transform:uppercase;border:2px solid #fff0a1;border-right-color:#765b12;border-bottom-color:#765b12;background:var(--gold);padding:10px 12px;box-shadow:3px 3px 0 #000}button:hover{filter:brightness(1.12);transform:translate(-1px,-1px)}button:active{border-color:#765b12;border-right-color:#fff0a1;border-bottom-color:#fff0a1;box-shadow:1px 1px 0 #000;transform:translate(2px,2px)}button:disabled{cursor:not-allowed;filter:grayscale(1);opacity:.55;transform:none}
    .game{max-width:1440px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;background:var(--panel);border:3px solid #777;border-top-color:#ddd;border-left-color:#ddd;padding:14px 16px;box-shadow:6px 6px 0 #000;margin-bottom:18px}.title{font-size:clamp(1.4rem,3vw,2.5rem);font-weight:bold;color:var(--gold);text-shadow:3px 3px #000;letter-spacing:.03em}.subtitle{color:var(--muted);font-size:.75rem;margin-top:4px}.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}.stat{min-width:105px;text-align:center;background:#202020;border:2px solid #0d0d0d;padding:8px 10px}.stat .label{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase}.stat .value{display:block;margin-top:4px;font-size:1.15rem;font-weight:bold}.money{color:var(--green)}.day{color:#a9d7f4}.goal{color:var(--gold)}
    .clicker{display:flex;align-items:center;gap:12px;background:#242424;border:2px solid var(--gold-dark);padding:8px 10px}.coin-btn{width:54px;height:54px;border-radius:50%;padding:0;font-size:1.55rem;background:var(--gold);border:3px solid #fff0a1;border-right-color:#765b12;border-bottom-color:#765b12}.clicker-copy{min-width:145px}.clicker-copy strong{display:block;color:var(--gold)}.clicker-copy small{color:var(--muted);line-height:1.35}.layout{display:grid;grid-template-columns:1.1fr 1.4fr 1.15fr;gap:18px;align-items:start}.panel{background:var(--panel);border:3px solid #777;border-top-color:#ccc;border-left-color:#ccc;box-shadow:6px 6px 0 #000;padding:16px}.panel h2{margin:0 0 14px;color:var(--gold);font-size:1rem;letter-spacing:.08em;text-transform:uppercase;text-shadow:2px 2px #000}.store-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.section-tag,.customer-badge{display:inline-block;padding:4px 7px;background:#161616;border:1px solid #777;color:var(--gold);font-size:.68rem;text-transform:uppercase}.supplier-list,.inventory-list,.customer-list{display:flex;flex-direction:column;gap:9px}.product-row,.customer-card,.build-stage{background:var(--panel-dark);border:2px solid #555;border-top-color:#888;border-left-color:#888;padding:10px}.product-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.product-name{font-weight:bold}.product-meta,.customer-info{font-size:.76rem;color:var(--muted);line-height:1.45}.buy-btn{padding:8px;background:#78c65a}.sell-btn{padding:8px;background:#72bde4}.next-btn{background:#e99a3e}.build-btn,.reset-btn{width:100%;margin-top:10px}.reset-btn{background:var(--red);color:#fff}.store-setup{border-top:2px solid #555;margin-top:16px;padding-top:15px}.customer-card{display:flex;flex-direction:column;gap:9px}.customer-header{display:flex;justify-content:space-between;gap:8px;align-items:center}.customer-name{font-weight:bold;color:#fff}.customer-actions{display:flex;gap:8px;align-items:center}.qty-select{width:68px;background:#111;color:#fff;border:2px solid #777;padding:8px}.house-panel{display:flex;flex-direction:column;gap:12px}.house-visual{position:relative;min-height:270px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:#6d9bb0;border:3px solid #333;padding:18px}.house-visual:before{content:"✦   .       ✦      .   ✦";position:absolute;top:18px;left:20px;color:#e9f2e9;letter-spacing:18px}.grass{position:absolute;bottom:0;left:0;right:0;height:44px;background:#4d843d;border-top:3px solid #315c30}.house{position:relative;width:220px;height:185px;bottom:16px;transition:transform .3s}.house-part{position:absolute;left:50%;transform:translateX(-50%);opacity:.12;transition:.35s;border:3px solid #292018}.house-part.active{opacity:1}.foundation{bottom:0;width:184px;height:28px;background:#888}.walls{bottom:27px;width:154px;height:78px;background:#d4a66a}.roof{bottom:92px;width:194px;height:55px;background:#8e4039;clip-path:polygon(0 100%,50% 0,100% 100%);border:none}.door{bottom:0;width:38px;height:61px;background:#694532}.window{width:27px;height:27px;bottom:45px;background:#78c8de}.window.left{left:calc(50% - 50px)}.window.right{left:calc(50% + 25px)}.build-stage{margin-top:9px}.build-stage h3{margin:0 0 6px;color:#fff;font-size:.95rem}.build-stage p{margin:5px 0;color:var(--muted);font-size:.76rem;line-height:1.45}.build-stage.locked{opacity:.68}.message{min-height:24px;color:var(--gold);font-weight:bold;line-height:1.4}.message.error{color:var(--red)}.message.success{color:var(--green)}
    @media(max-width:1050px){.layout{grid-template-columns:1fr 1fr}.house-panel{grid-column:1/-1;order:-1}}@media(max-width:680px){.game{padding:10px}.layout{grid-template-columns:1fr}.house-panel{grid-column:auto}.product-row{grid-template-columns:1fr auto}.product-row .product-meta{grid-column:1/-1;grid-row:2}.topbar{align-items:stretch}.clicker{flex:1}.stats{width:100%}.stat{flex:1;min-width:80px}}
  </style>
</head>
<body>
  <main class="game">
    <header class="topbar">
      <div><div class="title">BLOCKTOWN GENERAL STORE</div><div class="subtitle">A tiny shop, a growing fortune, and a home to build.</div></div>
      <div class="clicker"><button class="coin-btn" id="clickMoney" title="Work the counter">$</button><div class="clicker-copy"><strong>WORK THE COUNTER</strong><small>+<span id="clickValue">$1</span> each click<br>House level boosts your earnings.</small></div></div>
      <div class="stats"><div class="stat"><span class="label">Cash</span><span class="value money" id="money">$0</span></div><div class="stat"><span class="label">Day</span><span class="value day" id="day">1</span></div><div class="stat"><span class="label">House</span><span class="value goal" id="goal">0%</span></div></div>
    </header>
    <div class="layout">
      <section class="panel"><h2>Wholesaler</h2><div id="supplierList" class="supplier-list"></div><div class="store-setup"><div class="store-header"><h2 style="margin:0">Inventory</h2><span class="section-tag">Your shelves</span></div><div id="inventoryList" class="inventory-list"></div></div></section>
      <section class="panel"><div class="store-header"><h2 style="margin:0">Town Shoppers</h2><button class="next-btn" id="nextDayBtn">Next Day</button></div><div id="customerList" class="customer-list"></div></section>
      <section class="panel house-panel"><h2>House Progress</h2><div class="house-visual"><div class="house"><div class="house-part roof active" id="roofPart"></div><div class="house-part walls active" id="wallsPart"></div><div class="house-part foundation active" id="foundationPart"></div><div class="house-part door active" id="doorPart"></div><div class="house-part window left active" id="windowLeft"></div><div class="house-part window right active" id="windowRight"></div></div><div class="grass"></div></div><div id="buildStages"></div><div id="message" class="message"></div></section>
    </div>
  </main>
  <script>
    const products={bread:{name:"Bread",wholesale:2,retail:6,color:"#f4c95d",supplier:"Marta the Baker"},milk:{name:"Milk",wholesale:3,retail:7,color:"#d8eff7",supplier:"Pearl Dairy"},apples:{name:"Apples",wholesale:2,retail:5,color:"#d57b7b",supplier:"Farmer Reed"},soap:{name:"Soap",wholesale:4,retail:9,color:"#c2d8c8",supplier:"Luna Goods"},chairs:{name:"Chairs",wholesale:8,retail:18,color:"#d0b38d",supplier:"Oak & Pine"}};
    const houseStages=[{id:"foundation",label:"Foundation",cost:250,description:"Lay the concrete base for your home."},{id:"walls",label:"Walls",cost:650,description:"Build the main structure and rooms."},{id:"roof",label:"Roof",cost:1200,description:"Add a roof and keep the rain out."},{id:"windows",label:"Windows & Door",cost:1800,description:"Give the house some light and a front door."},{id:"complete",label:"Move In",cost:3000,description:"Finish the home and make it yours."}];
    const names=["Ava","Liam","Noah","Emma","Milo","Sofia","Ethan","Zoe","Leo","Nora","Theo","Ivy","Maya","Ruby"],areas=["Market","Corner","Sunset","Harbor","Maple","River","Hills","Farm"];
    const defaultState=()=>({money:80,day:1,stock:{bread:0,milk:0,apples:0,soap:0,chairs:0},houseStageIndex:0,customers:[],message:"Click the coin, stock the shelves, and build your little home.",totalSales:0,totalSpent:0,clicks:0});
    let state=loadState();
    function loadState(){try{const raw=localStorage.getItem("houseBuilderShop");if(!raw)return defaultState();const saved={...defaultState(),...JSON.parse(raw)};saved.clicks=Number(saved.clicks)||0;return saved}catch{return defaultState()}}
    function saveState(){localStorage.setItem("houseBuilderShop",JSON.stringify(state))} function moneyFormat(n){return "$"+Math.round(n).toLocaleString()} function clickValue(){return Math.max(1,Math.pow(2,state.houseStageIndex))} function showMessage(text,type=""){const el=document.getElementById("message");el.textContent=text;el.className="message"+(type?" "+type:"")}
    function renderSupplier(){const list=document.getElementById("supplierList");list.innerHTML="";Object.entries(products).forEach(([id,item])=>{const row=document.createElement("div");row.className="product-row";row.innerHTML=`<div><div class="product-name" style="color:${item.color}">${item.name}</div><div class="product-meta">Bulk ${moneyFormat(item.wholesale)} / unit<br>${item.supplier}</div></div><div class="product-meta">Retail ${moneyFormat(item.retail)}</div><button class="buy-btn" data-id="${id}">Buy 12</button>`;list.appendChild(row)});document.querySelectorAll(".buy-btn").forEach(btn=>btn.onclick=()=>{const id=btn.dataset.id,total=products[id].wholesale*12;if(state.money<total)return showMessage(`Need ${moneyFormat(total)} to buy 12 ${products[id].name}.`,"error");state.money-=total;state.totalSpent+=total;state.stock[id]+=12;state.message=`Bought 12 ${products[id].name}.`;saveState();render()})}
    function renderInventory(){const list=document.getElementById("inventoryList");list.innerHTML="";Object.entries(products).forEach(([id,item])=>{const row=document.createElement("div");row.className="product-row";row.innerHTML=`<div><div class="product-name">${item.name}</div><div class="product-meta">Stock: ${state.stock[id]}</div></div><div class="product-meta">Profit ${moneyFormat(item.retail-item.wholesale)}</div><span class="section-tag">${item.name}</span>`;list.appendChild(row)})}
    function generateCustomers(){const count=3+Math.min(3,Math.floor(state.day/2)),wealth=Math.max(1,state.money/350),list=[];for(let i=0;i<count;i++){const id=Object.keys(products)[Math.floor(Math.random()*5)],p=products[id],demand=1+Math.floor(Math.random()*(3+Math.min(4,Math.floor(state.houseStageIndex/2)))),budget=Math.round((p.retail*demand+12+Math.random()*25)*wealth);list.push({id:`customer-${state.day}-${i}-${Math.random().toString(36).slice(2,7)}`,name:names[Math.floor(Math.random()*names.length)],area:areas[Math.floor(Math.random()*areas.length)],productId:id,demand,budget,offer:Math.round(p.retail*demand*(1+Math.min(.55,state.houseStageIndex*.08)))})}state.customers=list}
    function nextDay(){state.day++;generateCustomers();showMessage(`Day ${state.day}: busier streets bring richer shoppers.`,"success");saveState();render()}
    function renderCustomers(){const list=document.getElementById("customerList");list.innerHTML="";if(!state.customers.length){list.innerHTML='<div class="customer-card"><strong>No customers today.</strong><div class="customer-info">Open tomorrow to bring in new townsfolk.</div></div>';return}state.customers.forEach(c=>{const p=products[c.productId],card=document.createElement("div");card.className="customer-card";card.innerHTML=`<div class="customer-header"><div class="customer-name">${c.name} from ${c.area}</div><div class="customer-badge">${p.name}</div></div><div class="customer-info">Wants <strong>${c.demand}</strong> ${p.name}<br>Budget: ${moneyFormat(c.budget)}<br>Offer: ${moneyFormat(c.offer)}</div><div class="customer-actions"><select class="qty-select" data-customer="${c.id}">${Array.from({length:Math.min(6,c.demand)},(_,i)=>`<option>${i+1}</option>`).join("")}</select><button class="sell-btn" data-customer="${c.id}">Sell</button></div>`;list.appendChild(card)});document.querySelectorAll(".sell-btn").forEach(btn=>btn.onclick=()=>{const c=state.customers.find(x=>x.id===btn.dataset.customer),qty=Number(document.querySelector(`[data-customer="${c.id}"]`).value);if(state.stock[c.productId]<qty)return showMessage(`Not enough ${products[c.productId].name} in stock.`,"error");const total=Math.round(c.offer*(qty/c.demand));if(c.budget<total)return showMessage(`${c.name} cannot afford that order yet.`,"error");state.stock[c.productId]-=qty;state.money+=total;state.totalSales+=total;state.customers=state.customers.filter(x=>x.id!==c.id);showMessage(`${c.name} bought ${qty} ${products[c.productId].name} for ${moneyFormat(total)}!`,"success");saveState();render()})}
    function renderHouseVisual(){const i=state.houseStageIndex;[["foundationPart",i>=0],["wallsPart",i>=1],["roofPart",i>=2],["doorPart",i>=3],["windowLeft",i>=3],["windowRight",i>=3]].forEach(([id,on])=>document.getElementById(id).classList.toggle("active",on));document.querySelector(".house").style.transform=`scale(${1+i*.04})`}
    function renderBuildStages(){const box=document.getElementById("buildStages");box.innerHTML="";houseStages.forEach((s,i)=>{const built=i<state.houseStageIndex,current=i===state.houseStageIndex,card=document.createElement("div");card.className=`build-stage ${current?"":"locked"}`;card.innerHTML=`<h3>${i+1}. ${s.label} ${built?"✓":""}</h3><p>${s.description}</p><p><strong>Cost:</strong> ${moneyFormat(s.cost)} &nbsp; <strong>Click power:</strong> ${moneyFormat(Math.pow(2,Math.min(i+1,10)))}</p>${built?'<button class="build-btn" disabled>Built</button>':current?`<button class="build-btn" data-build="${i}" ${state.money<s.cost?"disabled":""}>${state.money>=s.cost?`Build ${s.label}`:`Need ${moneyFormat(s.cost)}`}</button>`:""}`;box.appendChild(card)});document.querySelectorAll("[data-build]").forEach(btn=>btn.onclick=()=>{const s=houseStages[Number(btn.dataset.build)];if(state.money<s.cost)return showMessage(`Need ${moneyFormat(s.cost)} to build ${s.label}.`,"error");state.money-=s.cost;state.houseStageIndex++;showMessage(`${s.label} complete! Your counter now earns ${moneyFormat(clickValue())} per click.`,"success");saveState();render()});if(state.houseStageIndex>=houseStages.length){const done=document.createElement("div");done.className="build-stage";done.innerHTML="<h3>House complete ✓</h3><p>You turned shop profits into a proper Blocktown home. Keep serving the town!</p>";box.appendChild(done)}}
    function render(){document.getElementById("money").textContent=moneyFormat(state.money);document.getElementById("day").textContent=state.day;document.getElementById("goal").textContent=`${Math.min(100,Math.round(state.houseStageIndex/houseStages.length*100))}%`;document.getElementById("clickValue").textContent=moneyFormat(clickValue());renderSupplier();renderInventory();renderCustomers();renderHouseVisual();renderBuildStages();if(!document.getElementById("message").textContent.trim())showMessage(state.message)}
    document.getElementById("clickMoney").onclick=()=>{state.money+=clickValue();state.clicks++;state.message=`You worked the counter for ${moneyFormat(clickValue())}.`;saveState();render()};document.getElementById("nextDayBtn").onclick=nextDay;const reset=document.createElement("button");reset.className="reset-btn";reset.textContent="Reset Game";reset.onclick=()=>{if(confirm("Reset your shop and house progress?")){state=defaultState();generateCustomers();saveState();render();showMessage("A fresh start in Blocktown.","success")}};document.querySelector(".house-panel").appendChild(reset);if(!state.customers.length)generateCustomers();saveState();render();
  </script>
</body>
</html>
